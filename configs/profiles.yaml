low_cost:
  baseline:
    resources:
      - type: entra_p2
        enabled: true
        users: 2
      - type: azure_firewall
        enabled: true
        sku: "Basic"
      - type: bastion
        enabled: true
        sku: "Basic"
        hours_per_month: 730
      - type: sentinel
        enabled: true
        ingest_gb_per_day: 5
      - type: log_analytics
        enabled: true
        retention_days: 30
      - type: public_ip
        enabled: true
        sku: "Standard"         # Standard | Basic
        count: 2
        hours_per_month: 730
        notes: "2x public IPs for Firewall and Bastion"

