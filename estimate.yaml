meta:
  customer: "Example Customer"
  currency: "USD"
  region: "usgovvirginia"   # change per customer
  hours_per_month: 730
  # optional multipliers
  discount_pct: 0           # e.g., 12 means 12% off (EA/Azure plan/etc.)
  uplift_pct: 0             # contingency uplift

profile: "balanced"         # low_cost | balanced | high_security

profiles:
  low_cost:
    baseline:
      azure_firewall:
        sku: "Standard"
      sentinel:
        enabled: false
  high_security:
    baseline:
      azure_firewall:
        sku: "Premium"
      sentinel:
        enabled: true
      log_analytics:
        retention_days: 180

baseline:
  # ---- network/security table stakes ----
  azure_firewall:
    enabled: true
    sku: "Standard"          # Standard|Premium
    instances: 1
    data_processed_gb_per_month: 500

  nat_gateway:
    enabled: true
    gateways: 1
    data_processed_gb_per_month: 200

  bastion:
    enabled: true
    sku: "Standard"          # Basic|Standard (depends on offer/region)
    hours_per_month: 200     # not always 730; model expected usage
    data_out_gb_per_month: 50

  log_analytics:
    enabled: true
    ingest_gb_per_day: 5
    retention_days: 90

  sentinel:
    enabled: true
    ingest_gb_per_day: 5     # often same driver as LAW ingest; keep explicit
    commitment_tier_gb_per_day: 0   # 0 = pay-go; >0 = commitment model

  defender:
    enabled: true
    # keep as explicit assumptions for v1
    servers: 10
    sql: 0
    storage: 0

  entra_p2:
    enabled: true
    users: 25
    # Your internal estimate deck used $136.36/year per license in that ROM. [4](https://cloudfitsoftware-my.sharepoint.com/personal/jaysonmcfadden_cloudfitsoftware_com/_layouts/15/Doc.aspx?sourcedoc=%7B6E5E553B-587A-4A8F-9A48-71A731EF0212%7D&file=CloudFit%20-%20Hybrid%20Design%20Services%20-%20Managed%20Azure%20Enclave.pptx&action=edit&mobileredirect=true&DefaultItemOpen=1)
    price_per_user_per_year: 136.36

spokes:
  - name: "app1"
    enabled: true
    region: "usgovvirginia"
    resources:
      - type: "vm"
        name: "web"
        count: 2
        size: "Standard_D4s_v5"
        os: "linux"
        hours_per_month: 730
      - type: "storage"
        name: "diag"
        gb_per_month: 200

  - name: "data1"
    enabled: true
    resources:
      - type: "vm"
        name: "etl"
        count: 1
        size: "Standard_D8s_v5"
        os: "windows"
        hours_per_month: 300
      - type: "custom"
        name: "Private Endpoints"
        unit: "each"
        quantity: 10
        # For custom items, you can hardcode a unit price or wire it to an API later
        unit_price: 0