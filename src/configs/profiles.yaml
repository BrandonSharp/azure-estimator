# yaml-language-server: $schema=./profiles.schema.json
empty:
  baseline:
    resources: []
    
low_cost:
  baseline:
    resources:
      - type: azure_firewall
        sku: "Standard"
      - type: sentinel
        ingest_gb_per_day: 1
      - type: bastion
        sku: "Standard"
      - type: public_ip
        sku: "Standard"         # Standard | Basic
        count: 1
        hours_per_month: 730
        notes: "1x public IPs for Firewall"

balanced:
  baseline:
    resources:
      - type: entra_p2
        users: 10
      - type: azure_firewall
        sku: "Standard"
      - type: bastion
        sku: "Standard"
        hours_per_month: 730
      - type: sentinel
        ingest_gb_per_day: 10
      - type: log_analytics
        retention_days: 90
      - type: public_ip
        sku: "Standard"         # Standard | Basic
        count: 2
        hours_per_month: 730
        notes: "2x public IPs for Firewall and Bastion"

high_security:
  baseline:
    resources:
      - type: entra_p2
        users: 10
      - type: azure_firewall
        sku: "Premium"
      - type: bastion
        sku: "Premium"
      - type: sentinel
        commitment_tier_gb_per_day: 50
      - type: log_analytics
        retention_days: 180
      - type: public_ip
        sku: "Standard"         # Standard | Basic
        count: 2
        notes: "2x public IPs for Firewall and Bastion"
